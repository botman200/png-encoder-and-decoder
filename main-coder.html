<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Hex Encoder / Decoder</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; line-height: 1.6; }
        .box { border: 2px dashed #ccc; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
        textarea { width: 100%; height: 120px; margin: 10px 0; font-family: monospace; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #0056b3; }
        canvas { border: 1px solid #000; margin-top: 10px; max-width: 100%; display: block; }
        .action-row { margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Pixel Encoder / Decoder</h1>

    <!-- PART 1: ENCODE -->
    <div class="box">
        <h2>1. Encode Image to Pixel String</h2>
        <!-- Broadened accept parameter to process any standard image type -->
        <input type="file" id="imageInput" accept="image/*">
        <textarea id="outputString" placeholder="Your generated pixel data string will appear here..." readonly></textarea>
    </div>

    <!-- PART 2: DECODE -->
    <div class="box">
        <h2>2. Decode Pixel String Back to Image</h2>
        <textarea id="inputString" placeholder="Paste your generated pixel data string here..."></textarea>
        <div class="action-row">
            <button id="decodeBtn">Reconstruct Image</button>
            <button id="downloadBtn" style="background: #28a745; display: none;">Download Image</button>
        </div>
        <div>
            <h3>Result:</h3>
            <canvas id="outputCanvas"></canvas>
        </div>
    </div>

    <script>
        // --- PART 1: ENCODING LOGIC ---
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.drawImage(img, 0, 0);
                    
                    const imgData = ctx.getImageData(0, 0, img.width, img.height);
                    const data = imgData.data;
                    
                    let hexTokens = [`${img.width},${img.height}|`];
                    let currentChunk = "";
                    
                    let idx = 0;
                    const totalPixels = img.width * img.height;
                    
                    for (let i = 0; i < totalPixels; i++) {
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        idx += 4;

                        // Check if the hex value can be written in shorthand 3-digit format (e.g., #ffffff -> fff)
                        if ((r >> 4 === r & 15) && (g >> 4 === g & 15) && (b >> 4 === b & 15)) {
                            currentChunk += ((r >> 4).toString(16) + (g >> 4).toString(16) + (b >> 4).toString(16)) + ",";
                        } else {
                            // Standard full 6-digit hex format
                            currentChunk += ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1) + ",";
                        }

                        if (currentChunk.length > 50000) {
                            hexTokens.push(currentChunk);
                            currentChunk = "";
                        }
                    }
                    hexTokens.push(currentChunk);
                    
                    let finalString = hexTokens.join('');
                    if (finalString.endsWith(',')) {
                        finalString = finalString.slice(0, -1);
                    }
                    
                    document.getElementById('outputString').value = finalString;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- PART 2: DECODING LOGIC ---
        document.getElementById('decodeBtn').addEventListener('click', function() {
            const rawString = document.getElementById('inputString').value.trim();
            if (!rawString) return alert("Please paste a valid pixel string first!");

            const metaSplit = rawString.split('|');
            if (metaSplit.length !== 2) return alert("Invalid data format!");

            const dims = metaSplit[0].split(',');
            const width = parseInt(dims[0], 10);
            const height = parseInt(dims[1], 10);
            const colorString = metaSplit[1];

            if (isNaN(width) || isNaN(height)) return alert("Invalid image dimensions!");

            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;

            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            // Matches either a 3-character hex sequence OR a 6-character hex sequence
            const regex = /([0-9a-fA-F]{6})|([0-9a-fA-F]{3})/g;
            let match;
            let pixelIdx = 0;

            while ((match = regex.exec(colorString)) !== null && pixelIdx < width * height) {
                const hexStr = match[0];
                let r, g, b;

                if (hexStr.length === 3) {
                    // Reconstruct individual shorthand hex characters into 8-bit color channels
                    r = parseInt(hexStr[0] + hexStr[0], 16);
                    g = parseInt(hexStr[1] + hexStr[1], 16);
                    b = parseInt(hexStr[2] + hexStr[2], 16);
                } else {
                    // Standard full 6-digit channel extraction
                    const num = parseInt(hexStr, 16);
                    r = (num >> 16) & 255;
                    g = (num >> 8) & 255;
                    b = num & 255;
                }

                const dataOffset = pixelIdx * 4;
                data[dataOffset]     = r;
                data[dataOffset + 1] = g;
                data[dataOffset + 2] = b;
                data[dataOffset + 3] = 255; // Alpha Opaque

                pixelIdx++;
            }

            ctx.putImageData(imgData, 0, 0);
            document.getElementById('downloadBtn').style.display = 'inline-block';
        });

        // --- DOWNLOAD ACTION ---
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const canvas = document.getElementById('outputCanvas');
            const downloadLink = document.createElement('a');
            downloadLink.download = 'decoded_image.png';
            downloadLink.href = canvas.toDataURL('image/png'); // Keeps high fidelity via PNG format
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });
    </script>
</body>
</html>
