<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Chromebook File Packer</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #f9f9f9; color: #333; }
        .box { border: 2px dashed #bbb; padding: 30px; background: white; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #0056b3; }
        input[type="file"] { display: block; margin: 15px auto; }
        .status { font-weight: bold; margin-top: 15px; color: #28a745; }
    </style>
</head>
<body>

    <h1>Universal Chromebook Packer</h1>

    <!-- PACK SECTION -->
    <div class="box">
        <h2>1. Pack Any File(s) to Text</h2>
        <p>Select a video, image, exe, or group of files:</p>
        <input type="file" id="fileInput" multiple>
        <button id="packBtn" style="display:none;">Pack to Text File</button>
        <div id="packStatus" class="status"></div>
    </div>

    <!-- UNPACK SECTION -->
    <div class="box">
        <h2>2. Unpack Text back to Original File(s)</h2>
        <input type="file" id="textInput" accept=".txt">
        <button id="unpackBtn" style="display:none;">Unpack Archive</button>
        <div id="unpackStatus" class="status"></div>
    </div>

    <script>
        let filesToPack = null;
        let fileToUnpack = null;

        document.getElementById('fileInput').addEventListener('change', (e) => {
            filesToPack = e.target.files;
            document.getElementById('packBtn').style.display = filesToPack.length ? 'inline-block' : 'none';
        });

        document.getElementById('textInput').addEventListener('change', (e) => {
            fileToUnpack = e.target.files[0];
            document.getElementById('unpackBtn').style.display = fileToUnpack ? 'inline-block' : 'none';
        });

        // ENCODER: Compresses files to single Text payload
        document.getElementById('packBtn').addEventListener('click', async () => {
            const status = document.getElementById('packStatus');
            status.innerText = "Processing files into binary stream...";
            
            // Format a simple header block metadata mapping names and boundary sizes
            let headerParts = [];
            let fileBuffers = [];
            
            for (let file of filesToPack) {
                const buf = await file.arrayBuffer();
                headerParts.push(`${file.name}:${buf.byteLength}`);
                fileBuffers.push(new Uint8Array(buf));
            }
            
            const headerString = headerParts.join(';') + '|';
            const headerBytes = new TextEncoder().encode(headerString);
            
            // Consolidate everything into a unified array allocation
            let totalSize = headerBytes.length;
            fileBuffers.forEach(b => totalSize += b.length);
            
            let masterArray = new Uint8Array(totalSize);
            masterArray.set(headerBytes, 0);
            
            let offset = headerBytes.length;
            fileBuffers.forEach(b => {
                masterArray.set(b, offset);
                offset += b.length;
            });

            status.innerText = "Applying compression layout layers...";
            
            // Compress natively via CompressionStreams API
            const compressionStream = new Blob([masterArray]).stream().pipeThrough(new CompressionStream('gzip'));
            const compBuffer = await new Response(compressionStream).arrayBuffer();
            
            // Fast Base64 compilation processing loop
            let binary = '';
            const bytes = new Uint8Array(compBuffer);
            for (let i = 0; i < bytes.length; i += 0xffff) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0xffff));
            }
            const b64Text = btoa(binary);

            // Export text file directly out to system downloads
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(new Blob([b64Text], {type: "text/plain"}));
            anchor.download = "packed_archive.txt";
            anchor.click();
            status.innerText = "Done! Archive saved to your Files app Downloads folder.";
        });

        // DECODER: Unpacks Text back into distinct separate raw files
        document.getElementById('unpackBtn').addEventListener('click', () => {
            const status = document.getElementById('unpackStatus');
            status.innerText = "Reading text archive properties...";
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const b64Text = e.target.result.trim();
                    const binary = atob(b64Text);
                    const compBytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) compBytes[i] = binary.charCodeAt(i);
                    
                    status.innerText = "Decompressing archive components...";
                    const decompStream = new Blob([compBytes]).stream().pipeThrough(new DecompressionStream('gzip'));
                    const decompBuffer = await new Response(decompStream).arrayBuffer();
                    const masterArray = new Uint8Array(decompBuffer);
                    
                    // Parse original header blocks
                    let pipelineCursor = 0;
                    let headerString = "";
                    while (pipelineCursor < masterArray.length) {
                        const char = String.fromCharCode(masterArray[pipelineCursor++]);
                        if (char === '|') break;
                        headerString += char;
                    }
                    
                    const filesMeta = headerString.split(';');
                    filesMeta.forEach(meta => {
                        if (!meta) return;
                        const [name, sizeStr] = meta.split(':');
                        const size = parseInt(sizeStr, 10);
                        
                        const fileBytes = masterArray.subarray(pipelineCursor, pipelineCursor + size);
                        pipelineCursor += size;
                        
                        // Download the individual restored file
                        const anchor = document.createElement('a');
                        anchor.href = URL.createObjectURL(new Blob([fileBytes], {type: "application/octet-stream"}));
                        anchor.download = name;
                        anchor.click();
                    });
                    
                    status.innerText = "Success! All files unpackaged individually.";
                } catch(err) {
                    alert("Error: Malformed file archive or text structural sequence.");
                    status.innerText = "";
                }
            };
            reader.readAsText(fileToUnpack);
        });
    </script>
</body>
</html>
