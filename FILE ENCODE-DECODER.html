<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Packer</title>
<style>
body {
  font-family: sans-serif;
  max-width: 500px;
  margin: 20px auto;
  padding: 0 10px;
  background: #f9f9f9;
}
.box {
  border: 2px dashed #bbb;
  padding: 20px;
  background: #fff;
  border-radius: 8px;
  text-align: center;
  margin-bottom: 20px;
  word-wrap: break-word;
}
button {
  background: #007bff;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  cursor: pointer;
}
input, select {
  display: block;
  margin: 10px auto;
  padding: 8px;
  width: 80%;
}
.status {
  font-weight: bold;
  margin-top: 10px;
  color: #28a745;
}
.file-list {
  text-align: left;
  background: #eee;
  padding: 10px;
  max-height: 120px;
  overflow-y: auto;
  display: none;
}
</style>
</head>
<body>

<h1>Packer</h1>

<div class="box">
<h2>1. Pack</h2>
<input type="file"
  id="fileInput"
  multiple>
<div id="listCont"
  class="file-list">
  <ul id="list"></ul>
</div>
<input type="text"
  id="nameIn"
  placeholder="Name">
<input type="password"
  id="passIn"
  placeholder="Password">
<button id="packBtn"
  style="display:none;"
  >Pack to Text</button>
<div id="pStatus"
  class="status"></div>
</div>

<div class="box">
<h2>2. Unpack</h2>
<input type="file"
  id="textIn"
  accept=".txt">
<input type="password"
  id="uPassIn"
  placeholder="Password">
<button id="unpackBtn"
  style="display:none;"
  >Unpack Files</button>
<div id="uStatus"
  class="status"></div>
</div>

<script>
let fToPack = null;
let fToUnpack = null;
const fIn = document.getElementById(
  'fileInput'
);
const lCont = document.getElementById(
  'listCont'
);
const list = document.getElementById(
  'list'
);
const pBtn = document.getElementById(
  'packBtn'
);

fIn.addEventListener(
  'change',
  (e) => {
    fToPack = e.target.files;
    list.innerHTML = '';
    if (fToPack && fToPack.length > 0) {
      lCont.style.display = 'block';
      pBtn.style.display = 'inline-block';
      for (let f of fToPack) {
        const li = document.createElement(
          'li'
        );
        const mb = (
          f.size / 1024 / 1024
        ).toFixed(2);
        li.innerText = (
          f.name + ' (' + mb + ' MB)'
        );
        list.appendChild(li);
      }
    } else {
      lCont.style.display = 'none';
      pBtn.style.display = 'none';
    }
  }
);

document.getElementById('textIn')
.addEventListener(
  'change',
  (e) => {
    fToUnpack = e.target.files;
    const upBtn = document.getElementById(
      'unpackBtn'
    );
    upBtn.style.display = fToUnpack
      ? 'inline-block' : 'none';
  }
);

function toB64(blob) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onloadend = () => {
      const idx = (
        r.result.indexOf(',') + 1
      );
      res(r.result.substring(idx));
    };
    r.readAsDataURL(blob);
  });
}

function xor(bytes, pass) {
  if (!pass) return bytes;
  const pB = new TextEncoder()
    .encode(pass);
  for (let i = 0; i < bytes.length; i++) {
    bytes[i] ^= pB[i % pB.length];
  }
  return bytes;
}

pBtn.addEventListener(
  'click',
  async () => {
    const st = document.getElementById(
      'pStatus'
    );
    st.innerText = 'Packing...';
    let entries = [];
    let pSize = 0;
    
    for (let f of fToPack) {
      const buf = await f.arrayBuffer();
      const fB = new Uint8Array(buf);
      const nB = new TextEncoder()
        .encode(f.name);
      entries.push({
        nB: nB, fB: fB, sz: fB.length
      });
      pSize += (
        4 + nB.length + 4 + fB.length
      );
    }
    
    let mArr = new Uint8Array(4 + pSize);
    let v = new DataView(mArr.buffer);
    v.setUint32(0, entries.length, false);
    let out = 4;
    
    for (let e of entries) {
      v.setUint32(out, e.nB.length, false);
      out += 4;
      mArr.set(e.nB, out);
      out += e.nB.length;
      v.setUint32(out, e.sz, false);
      out += 4;
      mArr.set(e.fB, out);
      out += e.sz;
    }

    st.innerText = 'Compressing...';
    const bl = new Blob([mArr]);
    const cStr = bl.stream().pipeThrough(
      new CompressionStream('deflate')
    );
    const cBuf = await new Response(cStr)
      .arrayBuffer();
    let cBytes = new Uint8Array(cBuf);

    const pwd = document.getElementById(
      'passIn'
    ).value;
    if (pwd) {
      st.innerText = 'Encrypting...';
      cBytes = xor(cBytes, pwd);
    }
    
    st.innerText = 'Converting...';
    const cBl = new Blob([cBytes]);
    const b64 = await toB64(cBl);

    let rNm = document.getElementById(
      'nameIn'
    ).value;
    let cNm = rNm.trim().replace(
      /[\\/:*?"<>|]/g, ""
    ); 
    if (!cNm) cNm = "archive";
    if (!cNm.endsWith(".txt")) {
      cNm += ".txt";
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(
      new Blob(
        [b64], {type: "text/plain"}
      )
    );
    a.download = cNm;
    a.click();
    st.innerText = 'Saved: ' + cNm;
  }
);

document.getElementById('unpackBtn')
.addEventListener(
  'click',
  () => {
    const st = document.getElementById(
      'uStatus'
    );
    st.innerText = 'Reading...';
    const r = new FileReader();
    r.onload = async (e) => {
      try {
        const b64 = e.target.result.trim();
        st.innerText = 'Decoding...';
        const url = (
          'data:application/' +
          'octet-stream;base64,' + b64
        );
        const res = await fetch(url);
        const cBuf = await res.arrayBuffer();
        let cBytes = new Uint8Array(cBuf);
        
        const pwd = document.getElementById(
          'uPassIn'
        ).value;
        if (pwd) {
          st.innerText = 'Decrypting...';
          cBytes = xor(cBytes, pwd);
        }

        st.innerText = 'Decompressing...';
        const bl = new Blob([cBytes]);
        const dStr = bl.stream().pipeThrough(
          new DecompressionStream(
            'deflate'
          )
        );
        const dBuf = await new Response(
          dStr
        ).arrayBuffer();
        const mArr = new Uint8Array(dBuf);
        let v = new DataView(mArr.buffer);
        
        const fCount = v.getUint32(
          0, false
        );
        let out = 4;
        st.innerText = 'Extracting...';
        
        for (let i = 0; i < fCount; i++) {
          const nLen = v.getUint32(
            out, false
          );
          out += 4;
          const nB = mArr.subarray(
            out, out + nLen
          );
          const name = new TextDecoder()
            .decode(nB);
          out += nLen;
          const fLen = v.getUint32(
            out, false
          );
          out += 4;
          const fB = mArr.subarray(
            out, out + fLen
          );
          out += fLen;
          
          const a = document.createElement(
            'a'
          );
          a.href = URL.createObjectURL(
            new Blob(
              [fB], {
                type: 'application/' +
                'octet-stream'
              }
            )
          );
          a.download = name;
          a.click();
        }
        st.innerText = 'Unpacked!';
      } catch(err) {
        alert('Check password/file.');
        st.innerText = '';
      }
    };
    r.readAsText(fToUnpack[0]);
  }
);
</script>
</body>
</html>
