<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Chromebook File Packer</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #f9f9f9; color: #333; }
        .box { border: 2px dashed #bbb; padding: 30px; background: white; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #0056b3; }
        input[type="file"], select, input[type="text"] { display: block; margin: 15px auto; padding: 8px; box-sizing: border-box; }
        input[type="text"] { width: 60%; max-width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        .status { font-weight: bold; margin-top: 15px; color: #28a745; }
    </style>
</head>
<body>

    <h1>Universal Chromebook Packer</h1>

    <!-- PACK SECTION -->
    <div class="box">
        <h2>1. Pack Any File(s) or Folders to Text</h2>
        <p>Select what you want to pack:</p>
        
        <select id="uploadType">
            <option value="files">Individual File(s)</option>
            <option value="folder">An Entire Folder</option>
        </select>

        <div id="pickerContainer">
            <!-- Separated static input elements to completely avoid browser memory setting lockups -->
            <input type="file" id="fileInput" multiple>
            <input type="file" id="folderInput" webkitdirectory directory style="display: none;">
        </div>

        <input type="text" id="archiveNameInput" placeholder="Custom Archive Name (Optional)" accept-charset="UTF-8">

        <button id="packBtn" style="display:none;">Pack to Text File</button>
        <div id="packStatus" class="status"></div>
    </div>

    <!-- UNPACK SECTION -->
    <div class="box">
        <h2>2. Unpack Text back to Original File(s)</h2>
        <input type="file" id="textInput" accept=".txt">
        <button id="unpackBtn" style="display:none;">Unpack Archive</button>
        <div id="unpackStatus" class="status"></div>
    </div>

    <script>
        let filesToPack = null;
        let fileToUnpack = null;

        const uploadType = document.getElementById('uploadType');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const packBtn = document.getElementById('packBtn');

        // Toggle visibility between separate elements to reset picker logic safely
        uploadType.addEventListener('change', function(e) {
            filesToPack = null;
            packBtn.style.display = 'none';
            fileInput.value = '';
            folderInput.value = '';

            if (e.target.value === 'folder') {
                fileInput.style.display = 'none';
                folderInput.style.display = 'block';
            } else {
                fileInput.style.display = 'block';
                folderInput.style.display = 'none';
            }
        });

        function handleFileSelection(e) {
            filesToPack = e.target.files;
            packBtn.style.display = filesToPack && filesToPack.length ? 'inline-block' : 'none';
        }

        fileInput.addEventListener('change', handleFileSelection);
        folderInput.addEventListener('change', handleFileSelection);

        document.getElementById('textInput').addEventListener('change', (e) => {
            fileToUnpack = e.target.files;
            document.getElementById('unpackBtn').style.display = fileToUnpack ? 'inline-block' : 'none';
        });

        function bytesToBase64Native(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const splitIndex = reader.result.indexOf(',') + 1;
                    resolve(reader.result.substring(splitIndex));
                };
                reader.readAsDataURL(blob);
            });
        }

        // ENCODER
        packBtn.addEventListener('click', async () => {
            const status = document.getElementById('packStatus');
            status.innerText = "Processing selection into binary stream...";
            
            let fileEntries = [];
            let totalPayloadSize = 0;
            
            for (let file of filesToPack) {
                const buf = await file.arrayBuffer();
                const fileBytes = new Uint8Array(buf);
                
                const structuralPath = file.webkitRelativePath || file.name;
                const pathBytes = new TextEncoder().encode(structuralPath);
                
                fileEntries.push({
                    pathBytes: pathBytes,
                    fileBytes: fileBytes,
                    size: fileBytes.length
                });
                
                totalPayloadSize += 4 + pathBytes.length + 4 + fileBytes.length;
            }
            
            let masterArray = new Uint8Array(4 + totalPayloadSize);
            let view = new DataView(masterArray.buffer);
            
            view.setUint32(0, fileEntries.length, false);
            let offset = 4;
            
            for (let entry of fileEntries) {
                view.setUint32(offset, entry.pathBytes.length, false);
                offset += 4;
                
                masterArray.set(entry.pathBytes, offset);
                offset += entry.pathBytes.length;
                
                view.setUint32(offset, entry.size, false);
                offset += 4;
                
                masterArray.set(entry.fileBytes, offset);
                offset += entry.size;
            }

            status.innerText = "Compressing archive chunks (Max Deflate)...";
            
            const compressionStream = new Blob([masterArray]).stream().pipeThrough(new CompressionStream('deflate'));
            const compBuffer = await new Response(compressionStream).arrayBuffer();
            
            status.innerText = "Converting bytes to text stream safely...";
            
            const compressedBlob = new Blob([compBuffer]);
            const b64Text = await bytesToBase64Native(compressedBlob);

            let customName = document.getElementById('archiveNameInput').value.trim();
            customName = customName.replace(/[\\/:*?"<>|]/g, ""); 
            if (!customName) {
                customName = "packed_archive";
            }
            if (!customName.endsWith(".txt")) {
                customName += ".txt";
            }

            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(new Blob([b64Text], {type: "text/plain"}));
            anchor.download = customName;
            anchor.click();
            status.innerText = `Done! Saved as "${customName}" to your Downloads.`;
        });

        // DECODER
        document.getElementById('unpackBtn').addEventListener('click', () => {
            const status = document.getElementById('unpackStatus');
            status.innerText = "Reading text archive properties...";
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const b64Text = e.target.result.trim();
                    
                    status.innerText = "Decoding text format natively...";
                    const res = await fetch(`data:application/octet-stream;base64,${b64Text}`);
                    const compBuffer = await res.arrayBuffer();
                    const compBytes = new Uint8Array(compBuffer);
                    
                    status.innerText = "Decompressing archive components...";
                    const decompStream = new Blob([compBytes]).stream().pipeThrough(new DecompressionStream('deflate'));
                    const decompBuffer = await new Response(decompStream).arrayBuffer();
                    const masterArray = new Uint8Array(decompBuffer);
                    let view = new DataView(masterArray.buffer);
                    
                    const fileCount = view.getUint32(0, false);
                    let offset = 4;
                    
                    status.innerText = "Extracting contents to your machine...";
                    
                    for (let i = 0; i < fileCount; i++) {
                        const pathLen = view.getUint32(offset, false);
                        offset += 4;
                        
                        const pathBytes = masterArray.subarray(offset, offset + pathLen);
                        const structuralPath = new TextDecoder().decode(pathBytes);
                        offset += pathLen;
                        
                        const fileLen = view.getUint32(offset, false);
                        offset += 4;
                        
                        const fileBytes = masterArray.subarray(offset, offset + fileLen);
                        offset += fileLen;
                        
                        const anchor = document.createElement('a');
                        anchor.href = URL.createObjectURL(new Blob([fileBytes], {type: "application/octet-stream"}));
                        anchor.download = structuralPath;
                        anchor.click();
                    }
                    
                    status.innerText = "Success! Archive completely unpacked.";
                } catch(err) {
                    alert("Error processing the data stream.");
                    status.innerText = "";
                }
            };
            reader.readAsText(fileToUnpack);
        });
    </script>
</body>
</html>
